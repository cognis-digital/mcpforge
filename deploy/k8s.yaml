apiVersion: apps/v1
kind: Deployment
metadata: { name: mcpforge, labels: { app: mcpforge } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcpforge } }
  template:
    metadata: { labels: { app: mcpforge } }
    spec:
      containers:
        - name: mcpforge
          image: ghcr.io/cognis-digital/mcpforge:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: mcpforge }
spec:
  selector: { app: mcpforge }
  ports: [{ port: 80, targetPort: 8000 }]
